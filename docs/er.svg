<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    .box{fill:#fffefb;stroke:#164f3d;stroke-width:2;rx:10}.join{fill:#f8f0de;stroke:#c89c4b;stroke-width:2;rx:10}
    .title{font:bold 18px sans-serif;fill:#7b1e2b}.field{font:13px monospace;fill:#26332e}.line{stroke:#68736e;stroke-width:2}
    .label{font:12px sans-serif;fill:#68736e}.head{stroke:#dddcd5}
  </style>
  <rect width="1200" height="720" fill="#f5f2eb"/>
  <text x="45" y="45" class="title" style="font-size:26px">HKU Library Portal · ER Diagram</text>
  <g transform="translate(45 85)"><rect class="box" width="200" height="135"/><text class="title" x="15" y="28">ACCOUNT</text><path class="head" d="M0 42h200"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">UK username</text><text class="field" x="15" y="109">role · active</text></g>
  <g transform="translate(45 285)"><rect class="box" width="200" height="165"/><text class="title" x="15" y="28">STUDENT</text><path class="head" d="M0 42h200"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">FK account_id</text><text class="field" x="15" y="109">UK student_no</text><text class="field" x="15" y="131">name · email</text><text class="field" x="15" y="153">max_loans</text></g>
  <g transform="translate(340 85)"><rect class="box" width="200" height="165"/><text class="title" x="15" y="28">BOOK</text><path class="head" d="M0 42h200"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">UK isbn</text><text class="field" x="15" y="109">title · publisher</text><text class="field" x="15" y="131">year · language</text><text class="field" x="15" y="153">category</text></g>
  <g transform="translate(680 85)"><rect class="box" width="200" height="135"/><text class="title" x="15" y="28">AUTHOR</text><path class="head" d="M0 42h200"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">UK name</text></g>
  <g transform="translate(565 285)"><rect class="box" width="220" height="175"/><text class="title" x="15" y="28">BOOK_COPY</text><path class="head" d="M0 42h220"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">FK book_id · library_id</text><text class="field" x="15" y="109">UK barcode</text><text class="field" x="15" y="131">shelf_location</text><text class="field" x="15" y="153">status · reserved_for</text></g>
  <g transform="translate(945 285)"><rect class="box" width="200" height="135"/><text class="title" x="15" y="28">LIBRARY</text><path class="head" d="M0 42h200"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">UK name</text><text class="field" x="15" y="109">location · hours</text></g>
  <g transform="translate(340 530)"><rect class="box" width="220" height="165"/><text class="title" x="15" y="28">LOAN</text><path class="head" d="M0 42h220"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">FK copy_id · student_id</text><text class="field" x="15" y="109">borrowed_at · due_at</text><text class="field" x="15" y="131">returned_at</text><text class="field" x="15" y="153">renew_count · issued_by</text></g>
  <g transform="translate(680 530)"><rect class="box" width="230" height="150"/><text class="title" x="15" y="28">RESERVATION</text><path class="head" d="M0 42h230"/><text class="field" x="15" y="65">PK id</text><text class="field" x="15" y="87">FK student_id · book_id</text><text class="field" x="15" y="109">status · queued_at</text><text class="field" x="15" y="131">fulfilled_at</text></g>
  <g transform="translate(690 245)"><rect class="join" width="175" height="95"/><text class="title" x="15" y="28">BOOK_AUTHOR</text><text class="field" x="15" y="55">PK/FK book_id</text><text class="field" x="15" y="77">PK/FK author_id</text></g>
  <path class="line" d="M145 220v65M245 367h115v245h-20M245 367h150v238h285M540 167h150M777 245v-25M440 250v115h125M675 460v70M785 605h-225M880 167h80v118M945 352H785"/>
  <text class="label" x="155" y="258">1 : 0..1</text><text class="label" x="270" y="352">1 : N loans</text><text class="label" x="300" y="590">student</text><text class="label" x="590" y="515">copy history</text><text class="label" x="585" y="155">M : N authors</text><text class="label" x="895" y="337">1 : N holdings</text>
</svg>
