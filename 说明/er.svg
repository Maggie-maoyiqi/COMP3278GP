<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300"><rect width="1200" height="1300" fill="#f5f6f1"/><style>text{font-family:Arial,sans-serif;fill:#293623}.field{font-size:13px}.title{font-size:17px;font-weight:bold}.edge{fill:none;stroke:#819767;stroke-width:2}</style><text x="40" y="32" class="title">幕间 · ER 图（文本演员名单版）</text><text x="40" y="55" font-size="12">PK 主键 · FK 外键 · 父端 1 / 子端 0..N；城市与演员名单均为文本属性</text><path class="edge" d="M350 160 H440"/><text x="360" y="150" font-size="12">1</text><text x="405" y="150" font-size="12">0..N</text><path class="edge" d="M840 160 H750"/><text x="805" y="150" font-size="12">1</text><text x="760" y="150" font-size="12">0..N</text><path class="edge" d="M500 280 V360 H195 V440"/><text x="505" y="322" font-size="12">1</text><text x="200" y="428" font-size="12">0..N</text><path class="edge" d="M595 280 V440"/><text x="600" y="322" font-size="12">1</text><text x="600" y="428" font-size="12">0..N</text><path class="edge" d="M595 583 V740"/><text x="600" y="645" font-size="12">1</text><text x="600" y="728" font-size="12">0..N</text><path class="edge" d="M840 820 H750"/><text x="805" y="810" font-size="12">1</text><text x="760" y="810" font-size="12">0..N</text><path class="edge" d="M195 883 V1050"/><text x="200" y="945" font-size="12">1</text><text x="200" y="1038" font-size="12">0..N</text><rect x="40" y="80" width="310" height="124" rx="7" fill="white" stroke="#b8c6a7"/><rect x="40" y="80" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="52" y="103">剧目 / productions</text><text class="field" x="52" y="134">id : INTEGER PK</text><text class="field" x="52" y="153">title : TEXT </text><text class="field" x="52" y="172">description : TEXT </text><text class="field" x="52" y="191">poster_url : TEXT </text><rect x="440" y="80" width="310" height="200" rx="7" fill="white" stroke="#b8c6a7"/><rect x="440" y="80" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="452" y="103">演出批次 / runs</text><text class="field" x="452" y="134">id : INTEGER PK</text><text class="field" x="452" y="153">production_id : INTEGER FK</text><text class="field" x="452" y="172">venue_id : INTEGER FK</text><text class="field" x="452" y="191">start_date : TEXT </text><text class="field" x="452" y="210">end_date : TEXT </text><text class="field" x="452" y="229">schedule_url : TEXT </text><text class="field" x="452" y="248">seatmap_url : TEXT </text><text class="field" x="452" y="267">published : INTEGER </text><rect x="840" y="80" width="310" height="124" rx="7" fill="white" stroke="#b8c6a7"/><rect x="840" y="80" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="852" y="103">场馆 / venues</text><text class="field" x="852" y="134">id : INTEGER PK</text><text class="field" x="852" y="153">city : TEXT </text><text class="field" x="852" y="172">name : TEXT </text><text class="field" x="852" y="191">address : TEXT </text><rect x="40" y="440" width="310" height="124" rx="7" fill="white" stroke="#b8c6a7"/><rect x="40" y="440" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="52" y="463">演出场次 / performances</text><text class="field" x="52" y="494">id : INTEGER PK</text><text class="field" x="52" y="513">run_id : INTEGER FK</text><text class="field" x="52" y="532">starts_at : TEXT </text><text class="field" x="52" y="551">cast_text : TEXT </text><rect x="440" y="440" width="310" height="143" rx="7" fill="white" stroke="#b8c6a7"/><rect x="440" y="440" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="452" y="463">开票轮次 / sale_rounds</text><text class="field" x="452" y="494">id : INTEGER PK</text><text class="field" x="452" y="513">run_id : INTEGER FK</text><text class="field" x="452" y="532">opens_at : TEXT </text><text class="field" x="452" y="551">kind : TEXT </text><text class="field" x="452" y="570">note : TEXT </text><rect x="840" y="740" width="310" height="105" rx="7" fill="white" stroke="#b8c6a7"/><rect x="840" y="740" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="852" y="763">售票渠道 / channels</text><text class="field" x="852" y="794">id : INTEGER PK</text><text class="field" x="852" y="813">name : TEXT </text><text class="field" x="852" y="832">url : TEXT </text><rect x="440" y="740" width="310" height="124" rx="7" fill="white" stroke="#b8c6a7"/><rect x="440" y="740" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="452" y="763">轮次渠道 / sale_channels</text><text class="field" x="452" y="794">id : INTEGER PK</text><text class="field" x="452" y="813">sale_round_id : INTEGER FK</text><text class="field" x="452" y="832">channel_id : INTEGER FK</text><text class="field" x="452" y="851">eligibility : TEXT </text><rect x="40" y="740" width="310" height="143" rx="7" fill="white" stroke="#b8c6a7"/><rect x="40" y="740" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="52" y="763">账户 / accounts</text><text class="field" x="52" y="794">id : INTEGER PK</text><text class="field" x="52" y="813">username : TEXT </text><text class="field" x="52" y="832">password_hash : TEXT </text><text class="field" x="52" y="851">salt : TEXT </text><text class="field" x="52" y="870">role : TEXT </text><rect x="40" y="1050" width="310" height="105" rx="7" fill="white" stroke="#b8c6a7"/><rect x="40" y="1050" width="310" height="35" rx="7" fill="#e5edda"/><text class="title" x="52" y="1073">登录会话 / sessions</text><text class="field" x="52" y="1104">token : TEXT PK</text><text class="field" x="52" y="1123">account_id : INTEGER FK</text><text class="field" x="52" y="1142">expires_at : TEXT </text><text x="440" y="1080" font-size="14">城市：venues.city TEXT</text><text x="440" y="1110" font-size="14">演员名单：performances.cast_text TEXT</text><text x="440" y="1140" font-size="13">整份名单作为展示文案；不拆分演员或角色关系。</text><text x="440" y="1170" font-size="13">组合唯一键、删除策略与时间约束见 database-design.md。</text></svg>